# Starship Configuration — optimized (scan only used runtimes)
# https://starship.rs/config/

command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$docker_context\
$kubernetes\
$aws\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Runtime detection — only scan by marker files, not extensions
[nodejs]
symbol = " "
style = "bold green"
detect_extensions = []
detect_files = ["package.json"]
detect_folders = []

[python]
symbol = " "
style = "bold yellow"
detect_extensions = []
detect_files = ["pyproject.toml", "requirements.txt"]
detect_folders = []

[golang]
symbol = " "
style = "bold cyan"
detect_extensions = []
detect_files = ["go.mod"]
detect_folders = []

[docker_context]
symbol = " "
style = "bold blue"

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold blue"

[aws]
symbol = " "
style = "bold orange"

[cmd_duration]
min_time = 2_000
format = " [$duration]($style)"
